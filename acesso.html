<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f7f1"><title>Acesse sua estante — Entrelinhas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
<link rel="stylesheet" href="acesso.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="acesso.js" defer></script></head>
<body><main class="access-shell"><a class="brand" href="index.html">entre<span>.</span>linhas</a><section class="access-card"><div class="kicker"><span class="material-symbols-outlined">auto_stories</span> SUA HISTÓRIA DE LEITURA</div><h1 id="formTitle">Abra sua estante.</h1><p class="intro" id="formIntro">Crie sua conta para guardar livros, acompanhar leituras e voltar às histórias que marcaram você.</p>
<div class="switcher"><button class="active" id="showSignup" type="button">Criar conta</button><button id="showLogin" type="button">Entrar</button></div>
<form id="signupForm"><label for="username">Nome de usuário</label><input id="username" autocomplete="username" minlength="3" maxlength="30" pattern="[A-Za-z0-9._-]+" placeholder="seuusuario" required><label for="fullName">Nome completo</label><input id="fullName" autocomplete="name" maxlength="100" placeholder="Seu nome e sobrenome" required><label for="signupEmail">E-mail</label><input id="signupEmail" type="email" autocomplete="email" placeholder="voce@exemplo.com" required><label for="signupPassword">Senha</label><input id="signupPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Pelo menos 8 caracteres" required><button class="submit" type="submit">Criar minha conta <span class="material-symbols-outlined">arrow_forward</span></button></form>
<form id="loginForm" hidden><label for="loginEmail">E-mail</label><input id="loginEmail" type="email" autocomplete="email" placeholder="voce@exemplo.com" required><label for="loginPassword">Senha</label><input id="loginPassword" type="password" autocomplete="current-password" required><button class="submit" type="submit">Entrar na minha estante <span class="material-symbols-outlined">arrow_forward</span></button></form>
<p class="message" id="authMessage" role="status" aria-live="polite"></p><a class="back" href="index.html"><span class="material-symbols-outlined">arrow_back</span> Voltar para o início</a></section><p class="small-print">Se a confirmação por e-mail estiver ativa, confirme o endereço antes de entrar.</p></main></body></html>
